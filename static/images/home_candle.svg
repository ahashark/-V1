<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="studioBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F6F6F6"/>
      <stop offset="100%" stop-color="#EAEAEA"/>
    </radialGradient>
    <linearGradient id="silverLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A9A9A"/>
      <stop offset="18%" stop-color="#F8F8F8"/>
      <stop offset="36%" stop-color="#BDBDBD"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="78%" stop-color="#8A8A8A"/>
      <stop offset="92%" stop-color="#E4E4E4"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFDFDF" stop-opacity="0.88"/>
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="50%" stop-color="#FAFAFA" stop-opacity="0.94"/>
      <stop offset="86%" stop-color="#EFEFEF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#D4D4D4" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="waxFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7F7F7"/>
      <stop offset="100%" stop-color="#ECECEC"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- CHANEL-Inspired Cool Alabaster Studio Canvas -->
  <rect width="800" height="800" fill="url(#studioBg)"/>
  <rect x="0" y="590" width="800" height="210" fill="#F1F1F1" opacity="0.8"/>
  <line x1="0" y1="590" x2="800" y2="590" stroke="#E2E2E2" stroke-width="1"/>

  <!-- Soft Ambient Floor Shadow -->
  <ellipse cx="425" cy="612" rx="185" ry="24" fill="url(#floorShadow)"/>

  <!-- Heavy Glass Tumbler Outer -->
  <rect x="275" y="255" width="250" height="348" rx="10" fill="url(#glassBody)" stroke="#D2D2D2" stroke-width="1.4"/>

  <!-- Pure Alabaster Scented Wax Core -->
  <rect x="291" y="286" width="218" height="288" rx="4" fill="url(#waxFill)"/>

  <!-- Thick Crystal Glass Base -->
  <rect x="279" y="574" width="242" height="26" rx="6" fill="#E4E4E4" opacity="0.85"/>
  <line x1="286" y1="575" x2="514" y2="575" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- Glass Vertical Specular Highlights -->
  <rect x="288" y="262" width="14" height="330" rx="6" fill="#FFFFFF" opacity="0.75"/>
  <rect x="502" y="262" width="7" height="330" rx="3" fill="#FFFFFF" opacity="0.45"/>

  <!-- Jet Black & Silver Couture Lid -->
  <rect x="269" y="232" width="262" height="26" rx="2" fill="#0F0F0F" stroke="#000000" stroke-width="0.8"/>
  <line x1="271" y1="236" x2="529" y2="236" stroke="#555555" stroke-width="1" opacity="0.7"/>
  <ellipse cx="400" cy="218" rx="22" ry="14" fill="url(#silverLid)" stroke="#7A7A7A" stroke-width="0.8"/>

  <!-- Stark Pure White & Jet Black Framed Couture Label -->
  <rect x="330" y="346" width="140" height="172" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
  <rect x="336" y="352" width="128" height="160" fill="none" stroke="#000000" stroke-width="0.7"/>

  <!-- Minimalist Monochrome Typography Emblem -->
  <text x="400" y="388" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9.5" letter-spacing="3.2" fill="#000000">MAISON</text>
  <text x="400" y="403" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="3.6" fill="#000000">L'ATELIER</text>
  <text x="400" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.5" letter-spacing="2.8" fill="#767676">LONDON</text>

  <line x1="378" y1="436" x2="422" y2="436" stroke="#000000" stroke-width="0.8"/>

  <text x="400" y="458" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" letter-spacing="2" fill="#000000">SCENTED</text>
  <text x="400" y="472" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" letter-spacing="2" fill="#000000">HOME CANDLE</text>
  <text x="400" y="494" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="7" letter-spacing="1.5" fill="#767676">200G · HAUTE PARFUMERIE</text>
</svg>
